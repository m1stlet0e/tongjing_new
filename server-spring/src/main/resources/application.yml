server:
  port: 9091

spring:
  application:
    name: tongjing-server
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
    username: postgres.qcscburadzpqquaxuvun
    password: wb1994051601A@
    hikari:
      maximum-pool-size: 5
      connection-timeout: 60000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: public
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

s3:
  endpoint-url: ""
  bucket: ""
  region: cn-beijing
  access-key: ""
  secret-key: ""

logging:
  level:
    org.hibernate.SQL: warn

# 演示数据：仅在 photos 表为空时插入若干作品与标签。生产环境请设 TONGJING_SEED_DEMO=false
# 本地上传：S3 未配置 bucket 时写入 local-dir，图片 URL 使用 public-base-url + /api/v1/local-media/...
tongjing:
  seed-demo-data: ${TONGJING_SEED_DEMO:true}
  upload:
    local-dir: ${TONGJING_LOCAL_UPLOAD_DIR:./data/uploads}
    public-base-url: ${TONGJING_PUBLIC_BASE_URL:http://127.0.0.1:9091}
